name: Release image

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly rebuild (Monday 03:23 UTC) so base-image fixes land without code changes
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      DENYLIST_REGEX: ${{ secrets.DENYLIST_REGEX }}

  image:
    name: build-scan-sign-push
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Build (linux/amd64, no network at runtime)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker buildx build --platform linux/amd64 --pull --load --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:sha-${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Trivy image scan (fail on HIGH/CRITICAL with a fix)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker save "$IMAGE:sha-${GITHUB_SHA}" -o /tmp/image.tar
          docker run --rm -v /tmp:/tmp "$TRIVY_IMAGE" image --quiet --input /tmp/image.tar \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Smoke test the image (starts read-only as non-root, answers 401 + metadata)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker run -d --name smoke --read-only -p 8000:8000 \
            -e ENTRA_TENANT_ID=11111111-2222-4333-8444-555555555555 \
            -e ENTRA_API_CLIENT_ID=aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee \
            -e PUBLIC_BASE_URL=https://planner.contoso.example/mcp \
            -e EXTRA_ALLOWED_HOSTS=localhost:8000 "$IMAGE:sha-${GITHUB_SHA}"
          for i in $(seq 1 30); do curl -sf localhost:8000/health/live && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/mcp)" = 401
          curl -s -D - -o /dev/null -X POST localhost:8000/mcp | grep -qi '^www-authenticate: Bearer resource_metadata='
          curl -sf localhost:8000/.well-known/oauth-protected-resource/mcp | grep -q '"resource": "https://planner.contoso.example/mcp"'
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE:sha-${GITHUB_SHA}")" = "65532:65532"
          docker rm -f smoke
      - name: SBOM (CycloneDX)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker run --rm -v /tmp:/tmp "$TRIVY_IMAGE" image --quiet --input /tmp/image.tar \
            --format cyclonedx --output /tmp/sbom.cdx.json
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker push -q "$IMAGE:sha-${GITHUB_SHA}"
          docker push -q "$IMAGE:latest"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Cosign keyless sign + SBOM attestation
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate /tmp/sbom.cdx.json "$IMAGE@$DIGEST"
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify the signature we just made
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            > /dev/null
          echo "cosign verify: OK" >> "$GITHUB_STEP_SUMMARY"
